<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council Rock North Bands</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="font-serif">
    <div id="header"></div>

    <main>
        <section class="relative h-[420px] overflow-hidden">
            <div class="absolute inset-0 bg-[#1A336E]/90"></div>
            <div class="relative z-10 flex h-full items-center justify-center text-center px-6">
                <div class="max-w-4xl text-white">
                    <h1 class="text-4xl md:text-6xl font-bold mb-4">SITE UNDER CONSTRUCTION</h1>
                    <p class="text-lg md:text-xl leading-8 mx-auto">
                        Please be patient, site is a work in progress
                    </p>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    
    <script>
        fetch("parts/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("parts/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>
</body>
</html>
